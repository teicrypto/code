name: Build APK + AAB

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Giai ma khoa ky release (neu co)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release (APK + AAB)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease
      - name: Kiem tra can le 16 KB cua thu vien native (Google Play yeu cau)
        continue-on-error: true
        run: |
          rm -rf /tmp/aab && mkdir /tmp/aab && unzip -q app/build/outputs/bundle/release/app-release.aab -d /tmp/aab
          for f in $(find /tmp/aab -name "*.so" -path "*arm64-v8a*"); do
            echo "== $f"; readelf -lW "$f" | awk '$1=="LOAD"{print "  LOAD align:", $NF}'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SysPulse-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SysPulse-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
